services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: tip_app
      POSTGRES_PASSWORD: tip_app
      POSTGRES_DB: tip_tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip_app -d tip_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5505:5505"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5505"
      DATABASE_URL: postgresql://tip_app:tip_app@db:5432/tip_tasks
      ENABLE_DEBUG_RESET: "false"
      RELEASE_VERSION: "1.0.0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
