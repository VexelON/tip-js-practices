name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice-14
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tip_app
          POSTGRES_PASSWORD: tip_app
          POSTGRES_DB: tip_tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tip_app -d tip_tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: practice-14/package-lock.json
      - run: npm ci
      - run: npm run quality
        env:
          DATABASE_URL: postgresql://tip_app:tip_app@127.0.0.1:5432/tip_tasks_test
